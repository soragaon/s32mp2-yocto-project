MACHINE = "stm32mp25-disco"
DISTRO = "stm32mp-headless"
PACKAGE_CLASSES = "package_deb"
CONF_VERSION = "2"
ACCEPT_EULA_stm32mp25-disco = "0"
BOOTSCHEME_LABELS = "optee"
BOOTDEVICE_LABELS = "sdcard"
WKS_IMAGE_FSTYPES = "wic wic.bz2 wic.bmap"
WKS_FILE = "${OPTEE_WIC_FILE}"
ST_BOOTFS = "1"
ST_USERFS = "1"
EXTRA_IMAGE_FEATURES = ""
BB_NUMBER_THREADS = "4"
PARALLEL_MAKE = "-j4"
BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},10G,100K HALT,${TMPDIR},2G,10K"
DL_DIR = "${TOPDIR}/../downloads"
SSTATE_DIR = "${TOPDIR}/../sstate-cache"
INHERIT += "rm_work"
PATCHRESOLVE = "noop"
GLIBC_GENERATE_LOCALES = "en_US.UTF-8"
# This host cannot resolve example.com; retain the sanity check on a reachable host.
CONNECTIVITY_CHECK_URIS = "https://github.com/"
